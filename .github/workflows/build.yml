name: Compila APK

# A ogni push compila l'app e (se la firma è configurata) la pubblica in una Release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # serve per creare le Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Chiave di firma: sta SOLO nei secret del repository (mai nel codice né in file pubblici).
      #   SIGNING_KEYSTORE_B64 = il file della chiave codificato in testo
      #   SIGNING_PASSWORD     = la sua password
      - name: Prepara la chiave di firma
        id: sign
        run: |
          if [ -z "$SIGNING_PASSWORD" ] || [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::warning::Mancano i secret SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD: compilo senza firma e non pubblico la Release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KS="$RUNNER_TEMP/pannello-release.p12"
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$KS"
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Compila
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace -PappVersionCode=${{ github.run_number }} 2>&1 | tee build.log

      # Se la compilazione fallisce, riassume gli errori in una nota ben visibile.
      - name: Riepilogo errori
        if: failure()
        run: |
          MSG=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not" -A2 build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Errori di compilazione::$MSG"

      - name: Rinomina l'APK
        run: cp app/build/outputs/apk/release/app-release*.apk il-mio-pannello.apk

      # Controlli ufficiali sull'APK: firma (v1/v2/v3), certificato, SDK minimo/target, ABI.
      - name: Verifica APK (apksigner + aapt)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "== apksigner verify =="; "$BT/apksigner" verify --verbose --print-certs il-mio-pannello.apk 2>&1 || echo "VERIFICA FALLITA"
            echo "== aapt badging =="; "$BT/aapt" dump badging il-mio-pannello.apk 2>&1 | grep -E "^package|sdkVersion|targetSdkVersion|native-code|uses-feature|launchable" 
          } | tee verifica.txt
          MSG=$(sed ':a;N;$!ba;s/\n/%0A/g' verifica.txt)
          echo "::notice title=Verifica APK::$MSG"
          ! grep -q "VERIFICA FALLITA" verifica.txt

      - name: APK come allegato della build (verifica)
        uses: actions/upload-artifact@v4
        with:
          name: il-mio-pannello-apk
          path: il-mio-pannello.apk

      - name: Pubblica la Release
        if: steps.sign.outputs.signed == 'true'
        run: |
          VERSION="1.1.${{ github.run_number }}"
          gh release create "v$VERSION" il-mio-pannello.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Il mio pannello $VERSION" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}."
          # Tiene solo le ultime 5 versioni.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E "^v1\." | tail -n +6 \
            | xargs -r -I{} gh release delete {} --cleanup-tag --yes

  # Prova su un emulatore Android TV (Android 12): l'APK deve installarsi come aggiornamento
  # della versione precedente e l'app deve avviarsi senza crash.
  prova-installazione:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: il-mio-pannello-apk
          path: apk
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulatore Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: bash .github/scripts/prova-installazione.sh apk/il-mio-pannello.apk
      - name: Riepilogo prova
        if: always()
        run: |
          if [ -f prova.txt ]; then
            MSG=$(sed ':a;N;$!ba;s/\n/%0A/g' prova.txt | cut -c1-3500)
            echo "::notice title=Prova emulatore::$MSG"
          else
            echo "::warning title=Prova emulatore::nessun risultato (emulatore non partito)"
          fi
