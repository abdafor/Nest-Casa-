name: Compila APK

# A ogni push compila l'app e (se la firma è configurata) la pubblica in una Release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # serve per creare le Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Chiave di firma: creata UNA volta sola e poi riusata, così gli aggiornamenti
      # si installano sopra la versione precedente. La password sta nei secret del repository.
      # Il file della chiave (protetto dalla password) vive in una Release privata "chiave-firma".
      - name: Prepara la chiave di firma
        id: sign
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::Manca il secret SIGNING_PASSWORD: compilo senza firma e non pubblico la Release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          KS="$RUNNER_TEMP/keys/pannello-release.p12"
          if gh release view chiave-firma >/dev/null 2>&1; then
            gh release download chiave-firma -p pannello-release.p12 -D "$RUNNER_TEMP/keys" --clobber
          else
            keytool -genkeypair -storetype PKCS12 -keystore "$KS" -alias pannello \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD" \
              -dname "CN=Il mio pannello, O=Casa, C=IT"
            gh release create chiave-firma "$KS" --prerelease --target "$GITHUB_SHA" \
              --title "Chiave di firma (NON cancellare)" \
              --notes "Chiave di firma dell'app, protetta dalla password nei secret. Se la cancelli, gli aggiornamenti non si installeranno più sopra la versione vecchia."
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Compila
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace -PappVersionCode=${{ github.run_number }} 2>&1 | tee build.log

      # Se la compilazione fallisce, riassume gli errori in una nota ben visibile.
      - name: Riepilogo errori
        if: failure()
        run: |
          MSG=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not" -A2 build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Errori di compilazione::$MSG"

      - name: Rinomina l'APK
        run: cp app/build/outputs/apk/release/app-release*.apk il-mio-pannello.apk

      - name: APK come allegato della build (verifica)
        uses: actions/upload-artifact@v4
        with:
          name: il-mio-pannello-apk
          path: il-mio-pannello.apk

      - name: Pubblica la Release
        if: steps.sign.outputs.signed == 'true'
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release create "v$VERSION" il-mio-pannello.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Il mio pannello $VERSION" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}."
          # Tiene solo le ultime 5 versioni.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v1\.0\.' | tail -n +6 \
            | xargs -r -I{} gh release delete {} --cleanup-tag --yes
